name: CI

# Pushes to main run it through deploy.yml.
on:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mypersonalfinance
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: mypersonalfinance_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mypersonalfinance"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://mypersonalfinance:change-me@localhost:5432/mypersonalfinance_test
    steps:
      - uses: actions/checkout@v4
      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
